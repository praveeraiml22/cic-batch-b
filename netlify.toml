# =====================================================================
# REQUIRED: add these SECRETS in Netlify UI
# (Site settings → Environment variables) — never commit them here:
#
#   SUPABASE_SERVICE_ROLE_KEY  → needed for admin server functions
#                                (user management, approvals, admin downloads)
#   LOVABLE_API_KEY            → only if you use Lovable AI features
#
# Without SUPABASE_SERVICE_ROLE_KEY, the public site still runs, but
# admin-only actions (approve users, change roles, admin downloads) fail.
# =====================================================================

# SPA-style fallback is NOT needed — Nitro's netlify preset wires the SSR
# function to handle all non-static routes automatically.
