# Netlify deployment config for this TanStack Start app.
# Lovable's own deployment ignores this file (it builds via its own pipeline
# targeting Cloudflare Workers), so adding this does NOT affect Lovable deploys.
#
# Nitro (used by TanStack Start under the hood) has a first-class "netlify"
# preset. Setting NITRO_PRESET=netlify at build time makes the build emit a
# Netlify Function for SSR + static assets that Netlify auto-detects.

[build]
  command = "bun run build"
  # Nitro's netlify preset emits static assets to `dist/` and the SSR handler
  # to `.netlify/functions-internal/server/` (auto-detected by Netlify).
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "20"
  VITE_SUPABASE_URL = "https://qvddcdwkbgjhkhbtefww.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2ZGRjZHdrYmdqaGtoYnRlZnd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzM2MDUsImV4cCI6MjA5NjUwOTYwNX0.x5r3CEVI_kFICh5witfk9iznkul08GbEfeJ3YUPsCLk"
  SUPABASE_URL = "https://qvddcdwkbgjhkhbtefww.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2ZGRjZHdrYmdqaGtoYnRlZnd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzM2MDUsImV4cCI6MjA5NjUwOTYwNX0.x5r3CEVI_kFICh5witfk9iznkul08GbEfeJ3YUPsCLk"

